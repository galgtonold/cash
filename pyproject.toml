[build-system]
# hatchling >= 1.28 writes Metadata-Version 2.5, which twine 6.2 rejects, and
# publish.yml runs `twine check`. Lift the bound once twine accepts 2.5.
requires = ["hatchling<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cash"]
# The bundle reaches users through the shared-data mapping below. The copy
# inside the package is only for `jupyter labextension develop` in a checkout,
# so the wheel leaves it out instead of shipping it twice.
exclude = ["/src/cash/labextension"]

# Ships the prebuilt JupyterLab extension that sends unsaved cell edits to cash.
# The directory name must equal the npm package name in labextension/package.json
# (test_labextension_packaging.py checks it). The bundle is committed so the wheel
# build never needs Node; rebuild it with `cd labextension && npm run build`.
[tool.hatch.build.targets.wheel.shared-data]
"src/cash/labextension" = "share/jupyter/labextensions/cash-live-cells"
"labextension/install.json" = "share/jupyter/labextensions/cash-live-cells/install.json"

# The sdist ships only what rebuilding the package needs. An include list keeps
# generated files out, and /src/cash is a directory, so new modules are included.
[tool.hatch.build.targets.sdist]
include = [
    "/src/cash",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    # The extension's source, so an sdist can rebuild the bundle. Listed file by
    # file so node_modules/ and lib/ never get in.
    "/labextension/install.json",
    "/labextension/package.json",
    "/labextension/tsconfig.json",
    "/labextension/README.md",
    "/labextension/src",
    "/labextension/scripts",
]

# The version lives only in src/cash/__init__.py's __version__.
[tool.hatch.version]
path = "src/cash/__init__.py"

[project]
name = "cash-lib"
dynamic = ["version"]
description = "A Python cache that re-runs only what changed."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Cash Contributors"},
]
keywords = [
    "cache",
    "caching",
    "memoization",
    "jupyter",
    "notebook",
    "ipython",
    "data-science",
    "machine-learning",
    "dependency-tracking",
    "incremental-computation",
    "pandas",
    "decorator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Jupyter",
    "Framework :: IPython",
]
dependencies = []

[project.optional-dependencies]
memory = ["psutil>=5.0,<7"]
pandas = ["pandas", "pyarrow>=13.0"]
ipynbname = ["ipynbname>=0.1"]
redis = ["redis>=4.0,<6"]
s3 = ["boto3>=1.26,<2"]
polars = ["polars>=1.0,<3"]
notebook = ["ipython>=8.0,<10"]
viz = [
    "matplotlib>=3.5,<4",
    "ipywidgets>=7.0,<9",
]
# Reading `[tool.cash]` needs a TOML parser, which the stdlib has only from 3.11.
toml = ["tomli>=1.1; python_version < '3.11'"]
# Composed from the other extras, so each version bound is declared once. The
# contributor extras (dev, docs, docs-test) stay out.
all = [
    "cash-lib[ipynbname,memory,notebook,pandas,polars,redis,s3,toml,viz]",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-mermaid2-plugin>=1.2",
]
# Packages the docs examples import. tests/docs stubs them by monkeypatching the
# real module, so they have to be installed.
docs-test = [
    "aiohttp>=3.9",
    "redis>=4.0,<6",
    "fakeredis>=2.0",
    # S3Backend imports boto3 itself, before any stub can step in.
    "boto3>=1.28",
]
dev = [
    # 8.2 reads arguments from a file: `pytest @tools/test_selection/core_set.txt`.
    "pytest>=8.2",
    "pytest-timeout",
    "pytest-xdist",
    "pytest-rerunfailures",
    "pytest-asyncio>=0.23",
    "nbclient",
    "jupyter_client",
    "ipykernel",
    "pandas",
    "pyarrow>=13.0",
    # Optional for users, needed here: cash ships a content hasher for each.
    "polars>=1.0,<3",
    "dask[dataframe]",
    # For the sparse-matrix branches of the size estimator tests.
    "scipy",
    # Optional for users. Without them here, the tests that need them would be
    # skipped at collection in CI without anyone noticing.
    "matplotlib>=3.5,<4",
    "pydantic>=2,<3",
    "ipywidgets>=7.0,<9",
    # The Redis backend tests run against fakeredis, which needs redis itself.
    "redis>=4.0,<6",
    "fakeredis>=2.0",
    # test_sdist_contents.py builds an sdist to check what it ships.
    "build",
    # test_an_in_project_extension_helper_keys_its_build.py compiles a C
    # extension with build_ext, which finds the compiler on every OS.
    "setuptools",
    # Integration tests import it inside a real kernel, where no stub reaches.
    "scikit-learn",
    # test_comm_reply_during_execution.py pumps the kernel event loop from inside
    # a cell, which ipykernel 7 no longer supports on its own.
    "jupyter_ui_poll",
    "nest_asyncio",
    # tools/test_selection/run_baseline.py records per-test coverage.
    "coverage",
    "traitlets",
    "pyinstrument>=4.6,<6",
    # An in-process S3 emulator for the object-storage docs examples and s3fs
    # tests. Those tests importorskip them.
    # The floor keeps pip from resolving s3fs 0.4: the newest boto3 (via moto)
    # is often ahead of what aiobotocore allows, and rather than an older
    # boto3 pip backtracked to the last s3fs without aiobotocore, which is
    # sync-only and makes fsspec warn on import.
    "s3fs>=2024.1",
    "moto[server]>=5.0",
]

[project.urls]
"Homepage" = "https://github.com/galgtonold/cash"
"Documentation" = "https://cash-lib.readthedocs.io/"
"Bug Tracker" = "https://github.com/galgtonold/cash/issues"
"Changelog" = "https://github.com/galgtonold/cash/blob/main/CHANGELOG.md"

[project.scripts]
cash = "cash.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 30
asyncio_mode = "auto"
# An xfail that starts passing means a bug got fixed or a test stopped testing,
# so it fails. Nondeterministic tests opt out per marker with strict=False.
xfail_strict = true
# Parallel by default, because integration tests mostly wait on kernel boot; use
# -n 0 to debug. worksteal, not loadscope: under loadscope one dead worker can
# abort or hang the whole run. 16 workers is about twice the kernel boot throttle
# (CASH_TEST_BOOT_THROTTLE, default 8); use fewer on a small machine. Reruns
# cover only kernel-boot and timeout failures, never a failed assertion.
addopts = "-n 16 --dist worksteal --max-worker-restart=24 --reruns 2 --reruns-delay 2 --only-rerun crashed --only-rerun ConnectionError --only-rerun WinError --only-rerun ZMQError --only-rerun node.down --only-rerun Not.properly.terminated --only-rerun Kernel.died --only-rerun failed.to.boot --only-rerun Timeout"
markers = [
    "expects_failed_writes: induces a cache-write failure on purpose; exempt from the discarded-write guard",
    "core: Core caching flow (basic variable tracking, cache hit/miss)",
    "loops: For/while loop caching and mutation patterns",
    "control: If/else/elif branch caching and condition changes",
    "upstream: Upstream simulation, dependency propagation, restore",
    "files: File dependency tracking (CSV, open, etc.)",
    "modules: Module import caching, reload detection, transitive deps",
    "mutations: Mutation detection (append, extend, subscript, etc.)",
    "skip_optimization: Skip optimization (already-executed detection)",
    "badges: Badge/metrics display integration",
    "restore: Disk restore after kernel restart",
    "fresh_kernel: Needs a real kernel process restart; opts out of CASH_TEST_REUSE_KERNEL",
    "libraries: Real-world library integration (pandas, sklearn, etc.)",
    "stress: Comprehensive stress/regression tests",
    "slow: Tests that take longer than usual",
    "perf: Asserts a wall-clock threshold; excluded from the unit CI job, run by the Benchmarks workflow",
    "docs_parity: Documentation feature-parity tests (extract code fences from docs and run them)",
]

[tool.ruff]
target-version = "py310"
line-length = 120
# Notebooks are example and test content; the claim fixtures are pinned byte-for-byte.
extend-exclude = ["*.ipynb", "tests/docs/_fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PLC2701", "PLW1514", "BLE001", "PGH004", "RUF100"]
ignore = ["E501", "E402"]
# A suppression must name the rule it silences (PGH004) and must silence
# something (RUF100), so a stale or blanket noqa fails the lint. In src/ a
# broad `except Exception` needs a noqa saying why swallowing everything is
# right there (BLE001), written as `# noqa: BLE001 - <reason>`.
# PLC2701 (importing another module's private name) and PLW1514 (a text-mode
# open() without an encoding, which reads cp1252 on Windows) are preview rules.
# With explicit-preview-rules, only they are switched on: no other preview rule
# or behaviour comes along.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.isort]
known-first-party = ["cash"]

[tool.ruff.lint.per-file-ignores]
# Trailing whitespace inside tests is notebook cell source used as test data.
"tests/**" = ["E731", "E741", "W291", "W293"]
# Only src/ is held to PLC2701 and BLE001. Tests, benchmarks and scripts reach
# into private names on purpose, to pin down or measure internals, and catch
# broadly to report or clean up.
"!src/**" = ["PLC2701", "BLE001"]
