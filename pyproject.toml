[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cash"]

# A source distribution only needs to REBUILD the package, so it ships exactly
# that: the package source, the build config, and the two files the metadata
# references (README = the PyPI description, LICENSE). Everything else in the
# repo — tests, docs, example notebooks, benchmarks, CI/governance files — is not
# required to build, install, or run cash, so it is deliberately NOT shipped. The
# demos and docs live on GitHub for anyone who wants them.
#
# This is an INCLUDE list. The usual objection — "an include list silently drops
# newly added package files" — does not apply here because ``src/cash`` is a
# whole DIRECTORY: new modules under it are picked up automatically. The payoff
# is that stray/generated/dev files can never leak in (hatchling's sdist walk
# does not honour the self-ignoring `.gitignore` that venv/coverage drop in their
# own output dirs, so an exclude list has to chase each one; a whitelist can't be
# surprised that way). Verify with an actual build, never with ``git`` alone.
[tool.hatch.build.targets.sdist]
include = [
    "/src/cash",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]

# Single source of truth for the version: src/cash/__init__.py's __version__.
# Keep the literal there in sync on release; pyproject reads it, so the wheel
# metadata and cash.__version__ can never disagree.
[tool.hatch.version]
path = "src/cash/__init__.py"

[project]
name = "cash-lib"
dynamic = ["version"]
description = "Smart caching for Python — automatic dependency tracking, persistent backends, and statement-level Jupyter notebook caching."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Cash Contributors"},
]
keywords = [
    "cache",
    "caching",
    "memoization",
    "jupyter",
    "notebook",
    "ipython",
    "data-science",
    "machine-learning",
    "dependency-tracking",
    "incremental-computation",
    "pandas",
    "decorator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Jupyter",
    "Framework :: IPython",
]
dependencies = []

[project.optional-dependencies]
memory = ["psutil>=5.0,<7"]
pandas = ["pandas", "pyarrow>=13.0"]
ipynbname = ["ipynbname>=0.1"]
redis = ["redis>=4.0,<6"]
s3 = ["boto3>=1.26,<2"]
sqlite = []  # uses stdlib sqlite3
cloudpickle = ["cloudpickle>=2.0,<4"]
polars = ["polars>=1.0,<3"]
notebook = ["ipython>=8.0,<10"]
viz = [
    "matplotlib>=3.5,<4",
    "ipywidgets>=7.0,<9",
]
# `all` = every user-facing extra, composed by reference (PEP 631 self-referential
# extras) rather than by hand-copying each requirement. Do NOT expand these back
# into a literal list: the hand-maintained version silently drifted out of sync
# with the individual extras (it dropped `ipython` entirely, and lost the upper
# bounds on polars, matplotlib and ipywidgets), so `pip install cash-lib[all]`
# would happily take a future ipython 10 / ipywidgets 9 / matplotlib 4 / polars 3
# that the individual extras explicitly exclude. Referencing the extras makes that
# class of drift structurally impossible — each bound is declared exactly once.
# `dev` and `docs` are deliberately absent: they are contributor tooling, not part
# of what a user means by "everything".
all = [
    "cash-lib[cloudpickle,ipynbname,memory,notebook,pandas,polars,redis,s3,sqlite,viz]",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-mermaid2-plugin>=1.2",
]
# Third-party packages that documentation pages import in their examples.
# tests/docs/ EXECUTES those pages, and its autouse fixtures stub the network
# and backend calls by monkeypatching the real module — so the module has to be
# importable for the stub to have anything to patch. When it is absent the
# fixture no-ops and the page dies on the real import instead, which is how the
# docs-parity job read as four broken pages when nothing was wrong with them.
# Everything else the docs touch (openai, httpx, boto3, sklearn, polars, ...)
# is injected as a fake module and needs no install.
docs-test = [
    "aiohttp>=3.9",
    "redis>=4.0,<6",
    "fakeredis>=2.0",
    # S3Backend does its own `import boto3` and raises DependencyNotFoundError
    # before any fixture can intercept, so the stub module is not enough here.
    "boto3>=1.28",
]
dev = [
    "pytest>=8.0",
    "pytest-subtests",
    "pytest-timeout",
    "pytest-xdist",
    "pytest-rerunfailures",
    "pytest-asyncio>=0.23",
    "nbclient",
    "jupyter_client",
    "ipykernel",
    "pandas",
    "pyarrow>=13.0",
    # scipy is used by tests/test_notebook/test_size_estimator.py to
    # exercise the csr/csc/coo branches of _estimate_object_size.
    "scipy",
    "nest_asyncio",
    "traitlets",
    "pyinstrument>=4.6,<6",
    # An in-process S3 emulator, so the object-storage examples in the docs run
    # against a real store rather than a stub. Two things need it, and neither
    # is servable any other way: the docs claim "a hit costs no download", which
    # is only checkable if something counts the requests; and cash's remote
    # token depends on which keys s3fs puts in fs.info(), which is a fact about
    # s3fs that only s3fs can confirm. Both tests importorskip, so a contributor
    # without these installed sees skips rather than failures.
    "s3fs",
    "moto[server]>=5.0",
]

[project.urls]
"Homepage" = "https://github.com/galgtonold/cash"
"Documentation" = "https://cash-lib.readthedocs.io/"
"Bug Tracker" = "https://github.com/galgtonold/cash/issues"
"Changelog" = "https://github.com/galgtonold/cash/blob/main/CHANGELOG.md"

[project.scripts]
cash = "cash.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 30
asyncio_mode = "auto"
# Parallel by default: integration tests each spawn a fresh Jupyter kernel and
# spend ~90% of wall-clock blocked on kernel boot/IPC, so a serial run pins one
# core and leaves the rest idle. For interactive debugging (pdb, -s) disable
# parallelism with `-n0`.
#
# Scheduler is `worksteal`, NOT `loadscope`. Worker deaths are inevitable across
# thousands of Jupyter-kernel spawns on Windows (boot-storm "node down"), and
# under loadscope a SINGLE death is catastrophic: its rescheduler can't reassign
# the dead worker's scope, so the master either aborts the whole session
# (INTERNALERROR KeyError) or hangs indefinitely (observed 15h; a 90s
# self-killing-worker repro hung the full 90s). worksteal isolates a death to the
# one in-flight test and redistributes the rest, so the run always completes;
# `--max-worker-restart` lets dead workers respawn. Neither suite needs
# loadscope's module-grouping (nb_runner is function-scoped; no module/session/
# class-scoped fixtures exist). `timeout=30` per test is the in-worker backstop.
#
# Worker count is pinned to 16, NOT `-n auto`. The suite is boot-throttle-bound
# (CASH_TEST_BOOT_THROTTLE, default 8), not CPU-bound: CPU never saturates even
# at 64 workers. A sweep on this box (32 logical / 24 physical) found n=16 both
# fastest (121s vs 135s at n=32) and most stable. Past ~2x the boot throttle,
# extra workers only queue kernel boots -- slowing AND destabilizing the run.
# Rule of thumb: workers ~= 2 x boot throttle. Lower on a much smaller box.
#
# Reruns absorb the residual transient kernel-boot infra casualties (a worker
# crashes / a kernel can't get a socket under boot-storm pressure -- WinError
# 10055, ZMQ "connection refused", "node down"). `--only-rerun` scopes retries to
# those infra signatures ONLY, so a real assertion failure still fails fast and
# clearly (no wasted retries, no masking of genuine test bugs). Reruns are
# reported, so any test that needed one stays visible. `.` stands in for spaces
# in the patterns to avoid TOML/shlex quoting.
# `Timeout` is in the list for the same reason: under worker oversubscription a
# heavy page (an IPython-kernel docs page caching multi-MB arrays, say) can blow
# the 30s per-test budget purely from I/O contention — bimodal ~8s vs ~39s. A
# genuinely hung test still fails, it just burns all three attempts first.
addopts = "-n 16 --dist worksteal --max-worker-restart=24 --reruns 2 --reruns-delay 2 --only-rerun crashed --only-rerun ConnectionError --only-rerun WinError --only-rerun ZMQError --only-rerun node.down --only-rerun Not.properly.terminated --only-rerun Kernel.died --only-rerun failed.to.boot --only-rerun Timeout"
filterwarnings = [
    "ignore:Passing individual keyword arguments to compute_cache_key:DeprecationWarning",
    "ignore:set_tracking_dicts\\(\\) is deprecated:DeprecationWarning",
]
markers = [
    "core: Core caching flow (basic variable tracking, cache hit/miss)",
    "loops: For/while loop caching and mutation patterns",
    "control: If/else/elif branch caching and condition changes",
    "upstream: Upstream simulation, dependency propagation, restore",
    "files: File dependency tracking (CSV, open, etc.)",
    "modules: Module import caching, reload detection, transitive deps",
    "mutations: Mutation detection (append, extend, subscript, etc.)",
    "skip_optimization: Skip optimization (already-executed detection)",
    "badges: Badge/metrics display integration",
    "restore: Disk restore after kernel restart",
    "libraries: Real-world library integration (pandas, sklearn, etc.)",
    "stress: Comprehensive stress/regression tests",
    "slow: Tests that take longer than usual",
    "docs_parity: Documentation feature-parity tests (extract code fences from docs and run them)",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["cash"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["cash"]
omit = [
    "tests/*",
    "examples/*",
    "*/ui/dashboard.py",
    "*/ui/debugger.py",
    "*/ui/visualizer.py",
    "*/ui/explorer.py",
    "*/backends/redis_backend.py",
    "*/backends/s3_backend.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 70
