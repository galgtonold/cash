[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cash"]

[project]
name = "cash-lib"
version = "0.5.0b1"
description = "Smart caching for Python — automatic dependency tracking, persistent backends, and statement-level Jupyter notebook caching."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Cash Contributors"},
]
keywords = [
    "cache",
    "caching",
    "memoization",
    "jupyter",
    "notebook",
    "ipython",
    "data-science",
    "machine-learning",
    "dependency-tracking",
    "incremental-computation",
    "pandas",
    "decorator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Jupyter",
    "Framework :: IPython",
]
dependencies = []

[project.optional-dependencies]
memory = ["psutil>=5.0,<7"]
pandas = ["pandas", "pyarrow>=13.0"]
ipynbname = ["ipynbname>=0.1"]
redis = ["redis>=4.0,<6"]
s3 = ["boto3>=1.26,<2"]
sqlite = []  # uses stdlib sqlite3
cloudpickle = ["cloudpickle>=2.0,<4"]
polars = ["polars>=1.0,<3"]
notebook = ["ipython>=8.0,<9"]
viz = [
    "matplotlib>=3.5,<4",
    "ipywidgets>=7.0,<9",
]
all = [
    "pandas",
    "pyarrow>=13.0",
    "psutil>=5.0,<7",
    "redis>=4.0,<6",
    "boto3>=1.26,<2",
    "cloudpickle>=2.0,<4",
    "polars",
    "matplotlib>=3.5",
    "ipywidgets>=7.0",
    "ipynbname>=0.1",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-mermaid2-plugin>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-subtests",
    "pytest-timeout",
    "pytest-xdist",
    "pytest-asyncio>=0.23",
    "nbclient",
    "jupyter_client",
    "ipykernel",
    "pandas",
    "pyarrow>=13.0",
    # scipy is used by tests/test_notebook/test_size_estimator.py to
    # exercise the csr/csc/coo branches of _estimate_object_size.
    "scipy",
    "nest_asyncio",
    "traitlets",
    "pyinstrument>=4.6,<6",
]

[project.urls]
"Homepage" = "https://github.com/galgtonold/cash"
"Documentation" = "https://github.com/galgtonold/cash/tree/main/docs"
"Bug Tracker" = "https://github.com/galgtonold/cash/issues"
"Changelog" = "https://github.com/galgtonold/cash/blob/main/CHANGELOG.md"

[project.scripts]
cash = "cash.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 30
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Passing individual keyword arguments to compute_cache_key:DeprecationWarning",
    "ignore:set_tracking_dicts\\(\\) is deprecated:DeprecationWarning",
]
markers = [
    "core: Core caching flow (basic variable tracking, cache hit/miss)",
    "loops: For/while loop caching and mutation patterns",
    "control: If/else/elif branch caching and condition changes",
    "upstream: Upstream simulation, dependency propagation, restore",
    "files: File dependency tracking (CSV, open, etc.)",
    "modules: Module import caching, reload detection, transitive deps",
    "mutations: Mutation detection (append, extend, subscript, etc.)",
    "skip_optimization: Skip optimization (already-executed detection)",
    "badges: Badge/metrics display integration",
    "restore: Disk restore after kernel restart",
    "libraries: Real-world library integration (pandas, sklearn, etc.)",
    "stress: Comprehensive stress/regression tests",
    "slow: Tests that take longer than usual",
    "docs_parity: Documentation feature-parity tests (extract code fences from docs and run them)",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["cash"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["cash"]
omit = [
    "tests/*",
    "examples/*",
    "*/ui/dashboard.py",
    "*/ui/debugger.py",
    "*/ui/visualizer.py",
    "*/ui/explorer.py",
    "*/backends/redis_backend.py",
    "*/backends/s3_backend.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 70
