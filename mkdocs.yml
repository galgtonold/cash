site_name: cash docs
# Read the Docs sets READTHEDOCS_CANONICAL_URL to the version's own root
# (https://cash-lib.readthedocs.io/en/latest/). The canonical tags, the
# sitemap and the 404 page's asset links are all built from site_url, so it
# must carry the /en/<version>/ prefix, not just the domain.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://cash-lib.readthedocs.io/en/latest/"]
site_description: A Python cache that re-runs only what changed.
site_author: Cash Contributors
repo_url: https://github.com/galgtonold/cash
repo_name: cash

theme:
  name: material
  # overrides/main.html: the browser tab title comes from the page's H1.
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.png
  # Light and dark follow the reader's system setting until they pick one
  # with the toggle in the header. cash-design.css holds the colours of both.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  font: false  # Use system font stacks (per cash design system), not Roboto.

copyright: cash is released under the <a href="https://github.com/galgtonold/cash/blob/main/LICENSE">MIT License</a>. Copyright &copy; 2025-2026 Cash Contributors.

# Working notes (specs / plans) live under docs/superpowers/ and are
# gitignored. Skip them entirely so `mkdocs build --strict` stays clean.
exclude_docs: |
  superpowers/

# Build-time fixes, each described in mkdocs_hooks.py: badge iframe paths made
# page-relative, docnum markers and "# test:inject:" lines stripped, the
# "Applies to" box turned into a path chip under the H1, printed-output
# blocks and Warnings-page path tags marked for their own look, repository
# files included (<!-- include: CHANGELOG.md -->) and nav cross-links added.
hooks:
  - mkdocs_hooks.py

# Raise link checks to warnings, so `mkdocs build --strict` fails on a link to
# a missing heading anchor, an unrecognised relative link, or a page that is
# neither in the nav nor excluded. mkdocs 1.6 leaves anchors at info.
validation:
  omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

extra_css:
  - stylesheets/cash-design.css

extra_javascript:
  - javascripts/badge-iframe-resize.js
  - javascripts/mermaid-sizing.js
  - javascripts/why-cash-matrix.js
  - javascripts/invalidation-playground.js
  - javascripts/cacheability-checker.js

plugins:
  # The default separator splits only on spaces and hyphens, so `%cash_on`,
  # `cash.register_hasher(` and `# @cash:no-cache` were indexed as one word
  # each and searching `cash_on` found nothing. This one also splits on
  # % @ . ` and brackets. Underscores stay inside words (cash_on is one
  # term), dots between digits stay too (0.11.0), and CamelCase splits.
  - search:
      separator: '[\s\u200b\-,:!=\[\]()"`/%@#]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - autorefs
  # Pages that moved keep working: the old URL (still linked from PyPI and
  # the 0.11.0 README) forwards to the page that replaced it.
  - redirects:
      redirect_maps:
        getting-started/quickstart.md: index.md
        api/experimental.md: api/inspection.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # Render the class/function heading itself (not just members).
            show_root_heading: true
            # Short name: "Cash" not "cash.Cash" — the page title carries
            # the module context already.
            show_root_full_path: false
            # No "view source on GitHub" links — keeps the page compact.
            show_source: false
            # Coloured badges next to each heading + TOC entry so readers
            # can tell class vs function vs dataclass at a glance.
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            # Render signature on its own line below the heading so the
            # heading text stays short and TOC entries don't blow up.
            separate_signature: true
            show_signature_annotations: true
            # Make type annotations in signatures linkable.
            signature_crossrefs: true
            # Preserve source order so we don't shuffle related methods.
            members_order: source
            # Parameters, returns and raises as a list: a name, its type and
            # the description under it. The table layout squeezed the Type
            # column to four or five lines, and on a phone the Description
            # column sat off-screen.
            docstring_section_style: list
            # Members default to one level under the class/function, so
            # H2 class -> H3 method renders naturally.
            heading_level: 2
            # Wrap long signatures at 60 characters, one parameter per line,
            # instead of one line that runs off the right edge. Formatting
            # needs ruff (or black) installed, so ruff is in the docs extra.
            line_length: 60
            # One signature for an overloaded function, not one per overload.
            show_overloads: false
            # The constructor's parameters belong to the class: no separate
            # __init__ entry, and no private or dunder members.
            merge_init_into_class: true
            filters: ["!^_"]
            # No "class-attribute instance-attribute" chips on every field.
            show_labels: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  # Material renders ```mermaid fences itself, in the page's colour scheme:
  # the diagram colours are the --md-mermaid-* tokens in cash-design.css.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Each page is listed once. mkdocs_hooks.py adds one cross-link that is not
# a nav entry of its own: "Why did it miss?" under Decorator > Start opens
# how-it-works/inspecting.md, so a decorator user asking why a call missed
# finds the answer in their tab.
nav:
  - Home:
    - Home: index.md
    - "Why cash?": why-cash.md
    - Installation: getting-started/installation.md
    - FAQ: faq.md
    - For coding agents: for-coding-agents.md
  - Decorator:
    - Start:
      - Quick start: getting-started/quickstart-script.md
      - "@cash.cache guide": decorator.md
      - Known limitations: decorator-limitations.md
    - What goes into the key:
      - Class methods: tutorials/feature-guides/caching-class-methods.md
      - File dependencies: tutorials/feature-guides/custom-file-sources.md
      - Dynamic dependencies: tutorials/feature-guides/dynamic-dependencies.md
      - Custom hashers: tutorials/feature-guides/custom-hashers.md
      - Purity markers: tutorials/feature-guides/purity-decorators.md
    - Kinds of functions:
      - Iterators: tutorials/feature-guides/iterator-caching.md
      - Async functions: tutorials/feature-guides/async-caching.md
      - Threads and processes: tutorials/feature-guides/thread-safety.md
    - Going to production:
      - Testing your code: tutorials/feature-guides/testing-your-code.md
      - Caching over a grid: tutorials/feature-guides/caching-over-a-grid.md
      - Deploying: tutorials/feature-guides/deploying.md
    - Use cases:
      - LLM API calls: tutorials/use-cases/llm-api-calls.md
      - Data engineering: tutorials/use-cases/data-engineering.md
      - Scientific computing: tutorials/use-cases/scientific-computing.md
  - Notebook:
    - Quick start: getting-started/quickstart-notebook.md
    - Notebook guide: notebook_caching_api.md
    - Reading the badge: badges.md
    - Controlling caching: tutorials/feature-guides/controlling-cache-behavior.md
    - Restarts and persistence: tutorials/feature-guides/smart-persistence.md
    - Cost model: cost-model.md
    - Debugging a notebook: tutorials/feature-guides/debugging-and-monitoring.md
    - Writing cache-safe cells: known-limitations.md
    - Moving to a module: tutorials/feature-guides/production-transition.md
    - "Use case: data science": tutorials/use-cases/data-science.md
  - Both paths:
    - Choosing a backend: tutorials/feature-guides/choosing-a-backend.md
    - Sharing a cache: tutorials/feature-guides/sharing-caches.md
    - Coming from other caches: migration_guide.md
  - How it works:
    - Overview: how-it-works/overview.md
    - The decorator path: how-it-works/decorator-path.md
    - The notebook path: how-it-works/notebook-path.md
    - Cache keys and lineage: how-it-works/cache-keys-and-lineage.md
    - Knowing when to recompute: how-it-works/invalidation.md
    - Knowing when not to cache: how-it-works/safety.md
    - Where your cache lives: how-it-works/storage.md
    - Seeing what cash did: how-it-works/inspecting.md
  # Everything a returning reader looks up, in one tab.
  - Reference:
    - Settings: getting-started/configuration.md
    - Command-line interface: cli.md
    - Magic commands: magics.md
    - Annotations: annotations.md
    - Warnings: warnings.md
    - API:
      - Overview: api/index.md
      - Cash class: api/cash.md
      - Backends: api/backends.md
      - Internals: api/backend_internals.md
      - Purity markers: api/purity.md
      - Configuration API: api/config.md
      - Data sources: api/data_sources.md
      - Exceptions and warnings: api/exceptions.md
      - Notebook integration: api/notebook.md
      - Inspection tools: api/inspection.md
    - Glossary: glossary.md
  - Project:
    - Changelog: changelog.md
    - Versioning: versioning.md
    - Benchmarks: benchmarks.md
    - How cash is tested: how-it-works/testing.md
    - Report a bug: report-a-bug.md
    - Security policy: security.md
    - Contributing: contributing.md
    - License: license.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/galgtonold/cash
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/cash-lib/
