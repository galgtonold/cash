site_name: Cash Documentation
site_url: https://cash-lib.readthedocs.io/
site_description: Smart caching library for Python with Jupyter notebook integration
site_author: Cash Contributors
repo_url: https://github.com/galgtonold/cash
repo_name: cash

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  font: false  # Use system font stacks (per cash design system), not Roboto.

# Working notes (specs / plans) live under docs/superpowers/ and are
# gitignored. Skip them entirely so `mkdocs build --strict` stays clean.
exclude_docs: |
  superpowers/

extra_css:
  - stylesheets/cash-design.css

extra_javascript:
  - javascripts/badge-iframe-resize.js
  - javascripts/why-cash-calculator.js

plugins:
  - search
  - mermaid2:
      arguments:
        theme: base
        themeVariables:
          fontFamily: -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif
          primaryColor: '#e6fffa'         # cash-green-bg — node fill
          primaryTextColor: '#006644'     # cash-green — node text
          primaryBorderColor: '#006644'   # cash-green — node border
          lineColor: '#996300'            # cash-ochre — edges
          secondaryColor: '#fffbe6'       # cash-ochre-bg — alt node fill
          secondaryTextColor: '#996300'
          secondaryBorderColor: '#996300'
          tertiaryColor: '#f5f5f5'        # cash-bg-section
          tertiaryTextColor: '#333333'    # cash-ink
          tertiaryBorderColor: '#dddddd'  # cash-rule-strong
          background: '#ffffff'
          mainBkg: '#e6fffa'
          edgeLabelBackground: '#ffffff'
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - "Why Cash?": why-cash.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Migration Guide: migration_guide.md
  - User Guide:
    - Notebook Caching: notebook_caching_api.md
    - Reading the Cash Badge: badges.md
    - Magic Commands: magics.md
    - Annotations: annotations.md
    - API Reference: api_reference.md
    - Configuration: getting-started/configuration.md
    - Command-line interface: cli.md
    - Cost model: cost-model.md
  - Tutorials:
    - Getting Started: tutorials/getting_started.md
    - Data Science Workflows: tutorials/data_science_workflows.md
    - Production Transition: tutorials/production_transition.md
    - Advanced Configuration: tutorials/advanced_configuration.md
    - Purity decorators: tutorials/purity.md
  - Technical Reference:
    - Architecture: notebook_caching_technical.md
    - Architecture Decisions: architecture_decisions.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/galgtonold/cash
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/cash-lib/
