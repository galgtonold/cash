name: Nightly integration

# The whole notebook integration suite. It takes over two hours of test time,
# too long for every push (ci.yml runs the core set there), so it runs every
# night and by hand from the Actions tab, split into shards that run in
# parallel. tools/test_selection/shard.py assigns each test to one shard by a
# stable hash of its node id, so the shards never overlap and together run
# every test. The wheel-gate job runs alongside the shards, and so does the
# held-unit job: the unit tests too slow for every push.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  integration:
    name: Integration shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # N in --shard=I/N is the number of jobs, so the matrix must hold nothing
      # but the shard numbers 1..N (tests/test_tooling/test_ci_covers_the_suite.py checks).
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `python -m` puts the repo root on sys.path, which `-p` needs to import
      # the plugin by its module name.
      - name: Run integration shard
        run: >-
          python -m pytest tests/test_notebook_integration
          -p tools.test_selection.shard
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          -n auto --tb=short -q

  # The unit suite on Windows with Python 3.10, the slowest job of all (45 min
  # of tests in two shards: its pure-Python heap walks), which a push to the
  # merge branch leaves out (ci.yml). Run on that branch, where the next
  # change to main is, so a Windows 3.10 failure shows the morning after.
  windows-310:
    name: Windows 3.10 unit shard ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The merge branch: claude/batch and the highest number.
      - name: Check out the merge branch
        shell: bash
        run: |
          branch=$(git ls-remote --heads origin 'refs/heads/claude/batch*' \
            | sed 's|.*refs/heads/||' | grep -E '^claude/batch[0-9]+$' \
            | sort -t h -k 2 -n | tail -1)
          echo "Testing ${branch:-the default branch}"
          if [ -n "$branch" ]; then git checkout -q "origin/$branch"; fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # As ci.yml's unit step, with its Windows 3.10 timeout, but keeping the
      # tests marked nightly: the only Windows run they get.
      - name: Run unit tests
        timeout-minutes: 55
        shell: bash
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_notebook_integration \
            --ignore=tests/test_wheel_gate \
            --ignore=tests/docs \
            -m "not perf" \
            -p tools.test_selection.shard --shard=${{ matrix.shard }}/2 \
            -n auto --tb=short -q -rs --durations=40 \
            -o faulthandler_timeout=120 -o timeout=90

  # The unit tests every push leaves out or shortens: those marked nightly
  # (a wheel build and pip install, real kernels per shape), which ci.yml's
  # unit step deselects, and the seed sweeps marked full_sweep, which a push
  # runs with a few seeds and CASH_TEST_FULL_SWEEP=1 runs with all of them
  # (tests/_sweeps.py).
  held-unit:
    name: Nightly and full-sweep unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the held unit tests
        env:
          CASH_TEST_FULL_SWEEP: "1"
        run: >-
          python -m pytest tests/
          --ignore=tests/test_notebook_integration
          --ignore=tests/test_wheel_gate
          --ignore=tests/docs
          -m "nightly or full_sweep"
          -n auto --tb=short -q -rs --durations=20

  # The wheel gate (scripts/wheel_gate.py): builds the wheel, installs it into
  # a fresh venv and drives a real Jupyter server through kernel restarts. The
  # unit and integration suites run the editable install through nbclient, so
  # they cannot see wheel-layout or real-restart bugs; this job is what does.
  wheel-gate:
    name: Wheel gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build

      - name: Run the wheel gate
        env:
          CASH_WHEEL_GATE: "1"
          CASH_WHEELGATE_ROOT: ${{ runner.temp }}/wheelgate
        run: python -m pytest -m wheel_gate tests/test_wheel_gate -n 0 -q -rs
