name: Nightly integration

# The whole notebook integration suite. It takes over two hours of test time,
# too long for every push (ci.yml runs the core set there), so it runs every
# night and by hand from the Actions tab, split into shards that run in
# parallel. tools/test_selection/shard.py assigns each test to one shard by a
# stable hash of its node id, so the shards never overlap and together run
# every test. The shards run on the oldest, a middle and the newest Python,
# on the merge branch when there is one. The wheel-gate job runs alongside
# the shards, and so do the held-unit job (the unit tests too slow for every
# push), the self-check job (the unit suite and the core set with every memo
# checked), the wheels-only install on the oldest Python and the speed
# report.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# What the workflow's token may do unless a job asks for more: read the
# repository, nothing else.
permissions:
  contents: read

jobs:
  # Every shard on three Pythons: 3.10 (no C extension, no run-time trace,
  # so a different engine keys and watches the body), 3.12 and the newest.
  # A scheduled run starts from the default branch; the first step moves to
  # the merge branch, where the next change to main is, so the whole suite
  # has run on that commit the morning after. A run started by hand tests
  # the branch it was started on.
  integration:
    name: Integration ${{ matrix.python }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The step below divides the suite by SHARDS, which must be the count of
      # shard numbers here: with a second axis the job total no longer is
      # (tests/test_tooling/test_ci_covers_the_suite.py checks both).
      matrix:
        python: ["3.10", "3.12", "3.14"]
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # The merge branch: claude/batch and the highest number.
      - name: Check out the merge branch
        if: github.event_name == 'schedule'
        run: |
          branch=$(git ls-remote --heads origin 'refs/heads/claude/batch*' \
            | sed 's|.*refs/heads/||' | grep -E '^claude/batch[0-9]+$' \
            | sort -t h -k 2 -n | tail -1)
          if [ -n "$branch" ]; then git checkout -q "origin/$branch"; fi
          echo "Testing ${branch:-the default branch} at $(git log -1 --format='%H %s')"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `python -m` puts the repo root on sys.path, which `-p` needs to import
      # the plugin by its module name.
      - name: Run integration shard
        env:
          SHARDS: "6"
        run: >-
          python -m pytest tests/test_notebook_integration
          -p tools.test_selection.shard
          --shard=${{ matrix.shard }}/$SHARDS
          -n auto --tb=short -q

  # The unit suite on Windows with Python 3.10, the slowest job of all (45 min
  # of tests in two shards: its pure-Python heap walks), which a push to the
  # merge branch leaves out (ci.yml). Run on that branch, where the next
  # change to main is, so a Windows 3.10 failure shows the morning after.
  windows-310:
    name: Windows 3.10 unit shard ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # The merge branch: claude/batch and the highest number.
      - name: Check out the merge branch
        shell: bash
        run: |
          branch=$(git ls-remote --heads origin 'refs/heads/claude/batch*' \
            | sed 's|.*refs/heads/||' | grep -E '^claude/batch[0-9]+$' \
            | sort -t h -k 2 -n | tail -1)
          echo "Testing ${branch:-the default branch}"
          if [ -n "$branch" ]; then git checkout -q "origin/$branch"; fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # As ci.yml's unit step, with its Windows 3.10 timeout, but keeping the
      # tests marked nightly: the only Windows run they get.
      - name: Run unit tests
        timeout-minutes: 55
        shell: bash
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_notebook_integration \
            --ignore=tests/test_wheel_gate \
            --ignore=tests/docs \
            -m "not perf" \
            -p tools.test_selection.shard --shard=${{ matrix.shard }}/2 \
            -n auto --tb=short -q -rs --durations=40 \
            -o faulthandler_timeout=120 -o timeout=90

  # The unit tests every push leaves out or shortens: those marked nightly
  # (a wheel build and pip install, real kernels per shape), which ci.yml's
  # unit step deselects, and the seed sweeps marked full_sweep, which a push
  # runs with a few seeds and CASH_TEST_FULL_SWEEP=1 runs with all of them
  # (tests/_sweeps.py).
  held-unit:
    name: Nightly and full-sweep unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the held unit tests
        env:
          CASH_TEST_FULL_SWEEP: "1"
        run: >-
          python -m pytest tests/
          --ignore=tests/test_notebook_integration
          --ignore=tests/test_wheel_gate
          --ignore=tests/docs
          -m "nightly or full_sweep"
          -n auto --tb=short -q -rs --durations=20

  # Every memo and fast path checked against the slow path. CASH_VERIFY=1
  # turns on all the self-checks (cash/_verify.py; docs/contributing.md
  # lists them): each answer cash reuses -- the key of a hit met again, the
  # code part of a key, a class's fold, a stored analysis, a watched value's
  # digest, a simulated cell -- is worked out again behind the reuse, and a
  # difference raises. A checked run is several times slower, so it runs
  # here and not on a push. The work-count tests (the internals folders)
  # are left out: they bound the work a call does, and a check adds to it.
  # The per-test time limit is raised for the same reason.
  self-check:
    name: Self-check (CASH_VERIFY=1)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the unit tests with every self-check on
        env:
          CASH_VERIFY: "1"
        run: >-
          python -m pytest tests/
          --ignore=tests/test_notebook_integration
          --ignore=tests/test_wheel_gate
          --ignore=tests/docs
          --ignore=tests/test_core/internals
          --ignore=tests/test_notebook/internals
          -m "not perf and not nightly"
          -n auto --tb=short -q -rs --durations=20
          -o timeout=120 -o faulthandler_timeout=240

      - name: Run the integration core set with every self-check on
        if: ${{ !cancelled() }}
        env:
          CASH_VERIFY: "1"
        run: >-
          python -m pytest @tools/test_selection/core_set.txt
          -n auto --tb=short -q -o timeout=180

  # The oldest Python cash supports, installed as a user installs it: the
  # wheel, and every dependency as a wheel. A dependency that stops releasing
  # for that Python fails nothing: pip installs its last release that still
  # does. The last step says so (tools/dependency_floor.py), and the step
  # before it fails if BLAKE3, which has compiled code, did not come along:
  # cash would hash with SHA-256 there, and key apart from every other install.
  # About 2 min.
  oldest-python-install:
    name: Wheels-only install on the oldest Python
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Keep in step with the first Python classifier in pyproject.toml
      # (tests/test_tooling/test_ci_covers_the_suite.py checks).
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Build the pure-Python wheel
        env:
          CASH_PURE_PYTHON: "1"
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # Outside the checkout, so nothing but the installed package is imported.
      - name: Install it from wheels only
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv v
          v/bin/python -m pip install -q --upgrade pip
          v/bin/python -m pip install --only-binary=:all: "$GITHUB_WORKSPACE"/dist/*.whl packaging
          v/bin/python -c "import cash, cash.bulk_digest as b; print('cash', cash.__version__, 'hashes with', b.ALGORITHM); assert b.ALGORITHM == 'blake3', 'blake3 did not install or load'"

      - name: Report dependencies that left this Python behind
        working-directory: ${{ runner.temp }}
        run: v/bin/python "$GITHUB_WORKSPACE/tools/dependency_floor.py"

  # Report only: the speed set's ratios (cash over plain Python, per scenario)
  # on the tested commit against main. Both sides are measured in this job,
  # on this runner, in alternating runs (benchmarks/speed_compare.py), so the
  # runner's own speed cancels out. A shared runner is still noisy: a flagged
  # scenario is a reason to measure on a quiet machine, and this job never
  # fails the run. About 10 min.
  speed:
    name: Speed set against main (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Check out the merge branch
        if: github.event_name == 'schedule'
        run: |
          branch=$(git ls-remote --heads origin 'refs/heads/claude/batch*' \
            | sed 's|.*refs/heads/||' | grep -E '^claude/batch[0-9]+$' \
            | sort -t h -k 2 -n | tail -1)
          if [ -n "$branch" ]; then git checkout -q "origin/$branch"; fi
          echo "Measuring ${branch:-the default branch} at $(git log -1 --format='%H %s')"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Exit 1 means a scenario moved by more than the threshold: reported
      # as a warning. Exit 2 means the comparison itself did not run.
      - name: Compare the speed set with main
        run: |
          status=0
          python benchmarks/speed_compare.py origin/main HEAD --json speed.json > speed.txt || status=$?
          cat speed.txt
          { echo '```'; cat speed.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = 1 ]; then echo "::warning::The speed set moved against main; see the job summary."; fi
          if [ "$status" -gt 1 ]; then exit "$status"; fi

      - name: Keep the measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: speed-set
          path: |
            speed.json
            speed.txt
          if-no-files-found: ignore

  # The wheel gate (scripts/wheel_gate.py): builds the wheel, installs it into
  # a fresh venv and drives a real Jupyter server through kernel restarts. The
  # unit and integration suites run the editable install through nbclient, so
  # they cannot see wheel-layout or real-restart bugs; this job is what does.
  wheel-gate:
    name: Wheel gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build

      - name: Run the wheel gate
        env:
          CASH_WHEEL_GATE: "1"
          CASH_WHEELGATE_ROOT: ${{ runner.temp }}/wheelgate
        run: python -m pytest -m wheel_gate tests/test_wheel_gate -n 0 -q -rs
