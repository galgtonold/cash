name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to Test PyPI instead'
        required: false
        default: 'true'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Release gate for doc-claim drift: the same check is advisory in ci.yml
      # and blocking here.
      - name: Install docs-claim test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs-test]"

      - name: Verify no drifted doc claims (release gate)
        env:
          CASH_CLAIMS_STRICT: "1"
        run: pytest tests/docs/test_claim_anchors.py::test_no_fingerprint_drift -q

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      # upload-artifact@v6 and download-artifact@v7 are the lowest majors that
      # run on node24. Newer pairs change unzip behaviour; bump both together.
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  # PyPI never takes a version back, so the wheel is installed and checked
  # before anything is uploaded: in a clean venv (never the checkout, whose
  # src/ would shadow what the wheel actually ships), its __version__ must be
  # the release tag, and JupyterLab must list the bundled extension. Nothing
  # else catches a wheel that installs but registers no extension.
  verify-wheel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the wheel into a clean venv
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one wheel in dist/, found: ${wheels[*]}"
            exit 1
          fi
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install "${wheels[0]}"

      # A manual dispatch has no release tag; it still checks that the wheel's
      # file name and __version__ agree.
      - name: Check __version__ against the release tag
        working-directory: ${{ runner.temp }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version=$("$RUNNER_TEMP/wheel-venv/bin/python" -c "import cash; print(cash.__version__)")
          echo "installed cash.__version__ = $version"
          wheel=$(basename "$GITHUB_WORKSPACE"/dist/*.whl)
          case "$wheel" in
            "cash_lib-$version-"*) ;;
            *) echo "wheel $wheel does not carry version $version"; exit 1 ;;
          esac
          if [ "$EVENT" = "release" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$tag" ]; then
              echo "release tag $GITHUB_REF_NAME does not match cash.__version__ $version"
              exit 1
            fi
          fi

      - name: Check the JupyterLab extension registers
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install "jupyterlab>=4,<5"
          listing=$("$RUNNER_TEMP/wheel-venv/bin/jupyter" labextension list 2>&1)
          echo "$listing"
          echo "$listing" | grep -E "cash-live-cells.*enabled.*OK" >/dev/null || {
            echo "the wheel installs but cash-live-cells is not registered and enabled"
            exit 1
          }

  publish-test:
    needs: [build, verify-wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_pypi == 'true'
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    needs: [build, verify-wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
