name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to Test PyPI instead'
        required: false
        default: 'true'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Release gate for doc-claim drift: the same check is advisory in ci.yml
      # and blocking here.
      - name: Install docs-claim test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs-test]"

      - name: Verify no drifted doc claims (release gate)
        env:
          CASH_CLAIMS_STRICT: "1"
        run: pytest tests/docs/test_claim_anchors.py::test_no_fingerprint_drift -q

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      # upload-artifact@v6 and download-artifact@v7 are the lowest majors that
      # run on node24. Newer pairs change unzip behaviour; bump both together.
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish-test:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_pypi == 'true'
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
