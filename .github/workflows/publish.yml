name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to Test PyPI instead'
        required: false
        default: 'true'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The real release gate for doc-claim drift. `docs-parity`'s "Report
      # drifted doc claims" step (ci.yml) is advisory-only on every PR; this
      # is where CASH_CLAIMS_STRICT=1 actually promotes it to blocking, on
      # the one workflow every release runs. `.github/copilot-instructions.md`
      # §1b's manual `--queue` check is the fast local echo of this gate, not
      # a substitute for it -- if it's skipped, this step still stops the
      # build.
      - name: Install docs-claim test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs-test]"

      - name: Verify no drifted doc claims (release gate)
        env:
          CASH_CLAIMS_STRICT: "1"
        run: pytest tests/docs/test_claim_anchors.py::test_no_fingerprint_drift -q

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build
      
      - name: Check package
        run: twine check dist/*
      
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish-test:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_pypi == 'true'
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      
      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
