name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Keep in lockstep with the `Programming Language :: Python :: 3.x`
        # classifiers in pyproject.toml: a version we advertise on PyPI but
        # never run is a support claim backed by nothing. requires-python is
        # ">=3.10", so 3.10 is the floor and the newest classifier is the ceiling.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      # EXCLUDE, never enumerate (CAS-152). This step used to name the ~8 files
      # it ran, which silently omitted 18 top-level test files and four of the
      # five test directories — and anything added later. A tracked regression
      # test for an Urgent correctness bug (CAS-175) sat red on main for weeks
      # because nothing outside the allowlist was ever executed by CI.
      #
      # So the default is now "run everything" and each exclusion has to justify
      # itself here:
      #   test_notebook_integration/  793 kernel-spinning files, ~16 min. The
      #                               headline features are covered by the smoke
      #                               subset below; run the rest locally.
      #   test_wheel_gate/            builds a wheel and starts a real Jupyter
      #                               server; belongs to the release gate.
      #   docs/                       has its own job, which needs the extra
      #                               docs-test dependencies.
      # Everything else — including anything added tomorrow — runs by default.
      #
      # `-n auto` overrides the `-n 16` in pyproject's addopts, which is tuned
      # for a 32-thread dev box. Hosted runners have 3-4 vCPUs, so 16 workers is
      # a 4-5x oversubscription that stalls timed sections and turns wall-clock
      # heuristics into coin flips — it is what made the cost-model floor test
      # fail only on the 3-vCPU macOS runner.
      - name: Run unit tests
        run: |
          pytest tests/ \
            --ignore=tests/test_notebook_integration \
            --ignore=tests/test_wheel_gate \
            --ignore=tests/docs \
            -n auto --tb=short -q

      # Curated subset of the notebook integration suite — the headline-feature
      # tests (basic flow, restore-after-restart, file invalidation, decorator
      # bridge, badge rendering, forward-probe skip, file-dep path fallback).
      # The full suite (~3.4k kernel-spinning tests) is too slow for per-push
      # CI; run it locally with `pytest tests/test_notebook_integration/`.
      - name: Run notebook integration smoke subset
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          pytest \
            tests/test_notebook_integration/test_basic_flow.py \
            tests/test_notebook_integration/test_disk_restore_after_restart.py \
            tests/test_notebook_integration/test_file_invalidation_real.py \
            tests/test_notebook_integration/test_decorator_bridge_integration.py \
            tests/test_notebook_integration/test_badge_integration.py \
            tests/test_notebook_integration/test_forward_probe_upstream_skip.py \
            tests/test_notebook_integration/test_file_dep_path_fallback.py \
            -n auto --tb=short -q
        timeout-minutes: 10

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        # Pin to the same ruff the pre-commit hook uses (.pre-commit-config.yaml).
        # Unpinned, CI installs the latest ruff and a new release can silently
        # re-redden the gate with rules the code was never linted against.
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.6

      - name: Run ruff check
        run: ruff check src/cash/ --select E,F,W --ignore E501,E402
      
      - name: Run ruff format check
        run: ruff format --check src/cash/ || true

  docs-parity:
    runs-on: ubuntu-latest
    continue-on-error: true   # PR1: soft gate. Flip to false after stabilization.
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `docs-test` carries the third-party packages doc examples import. The
      # autouse fixtures in tests/docs/conftest.py stub them by monkeypatching
      # the real module, so it has to be importable or the fixture no-ops and
      # the page dies on the import instead.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs-test]"

      - name: Run docs feature-parity tests
        run: pytest tests/docs/ -n auto -v --tb=short
