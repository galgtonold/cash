name: CI

# SCRATCH BRANCH ONLY (never merged): reproduce the Windows xdist worker crash in
# test_a_thread_left_running_by_a_cell_is_named.py::test_it_is_named_once_per_cell
# (CI 856, windows 3.14 shard 1/2). Run 2: CI's own fd capture; pytest's faulthandler
# keeps a copy of fd 2, so a dump at 20 s reaches this log before the 30 s timeout kills a worker.

on:
  push:
    branches: ["claude/scratch-win-thread"]

jobs:
  shard:
    name: shard ${{ matrix.shard }}/2 (${{ matrix.python-version }}, rep ${{ matrix.rep }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.10"]
        shard: [1, 2]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the shard as CI does (fd capture), with a faulthandler dump at 20 s
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_notebook_integration \
            --ignore=tests/test_wheel_gate \
            --ignore=tests/docs \
            -m "not perf" \
            -p tools.test_selection.shard --shard=${{ matrix.shard }}/2 \
            -n auto --tb=short -q -o faulthandler_timeout=20 --reruns 0 --durations=40 --junitxml=junit.xml
        shell: bash
      - name: Times of the thread tests
        if: always()
        run: |
          python -c "import xml.etree.ElementTree as E; [print(c.get('time'), c.get('classname'), c.get('name')) for c in E.parse('junit.xml').iter('testcase') if 'thread_left_running' in (c.get('classname') or '') or float(c.get('time') or 0) > 10]"
        shell: bash
