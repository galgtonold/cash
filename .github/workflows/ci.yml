name: CI

on:
  push:
    # Working branches too, so a change is green on every platform before
    # main moves to it.
    branches: [main, master, "claude/**", "cext/**"]
  pull_request:
    branches: [main, master]
  # Run by hand on any branch, e.g. one that is not ready for main.
  workflow_dispatch:

# A newer push to the same working branch supersedes a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Picks the tier. Working-branch pushes get a smaller matrix that fits GitHub's
  # free tier (20 concurrent jobs, 5 on macOS) without queueing; main, pull
  # requests into main and runs by hand get every OS x every supported Python.
  plan:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
      core: ${{ steps.plan.outputs.core }}
    steps:
      - id: plan
        env:
          FULL_TIER: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        run: |
          if [ "$FULL_TIER" = true ]; then
            # Keep the Python versions in step with the classifiers in pyproject.toml.
            unit='{
              "os": ["ubuntu-latest", "windows-latest", "macos-latest"],
              "python-version": ["3.10", "3.11", "3.12", "3.13", "3.14"],
              "shard": ["1/1"]
            }'
            core='["3.10", "3.11", "3.12", "3.13", "3.14"]'
          else
            # Oldest and newest Python on Windows and macOS, one Python on Linux.
            # A whole unit run takes ~18 min on Linux and over 20 on Windows, so
            # those run in shards; macOS takes ~13 and runs whole.
            unit='{"include": [
              {"os": "ubuntu-latest", "python-version": "3.13", "shard": "1/4"},
              {"os": "ubuntu-latest", "python-version": "3.13", "shard": "2/4"},
              {"os": "ubuntu-latest", "python-version": "3.13", "shard": "3/4"},
              {"os": "ubuntu-latest", "python-version": "3.13", "shard": "4/4"},
              {"os": "windows-latest", "python-version": "3.10", "shard": "1/2"},
              {"os": "windows-latest", "python-version": "3.10", "shard": "2/2"},
              {"os": "windows-latest", "python-version": "3.14", "shard": "1/2"},
              {"os": "windows-latest", "python-version": "3.14", "shard": "2/2"},
              {"os": "macos-latest", "python-version": "3.10", "shard": "1/1"},
              {"os": "macos-latest", "python-version": "3.14", "shard": "1/1"}
            ]}'
            core='["3.10", "3.13", "3.14"]'
          fi
          echo "unit=$(jq -c . <<< "$unit")" >> "$GITHUB_OUTPUT"
          echo "core=$(jq -c . <<< "$core")" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    # Shard 1/1 is the whole suite; only split runs name their shard.
    name: test (${{ matrix.os }}, ${{ matrix.python-version }}${{ matrix.shard != '1/1' && format(', shard {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unit) }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Run tests/ by exclusion, never by listing files, so a new test file runs
      # without anyone adding it here (tests/test_tooling/test_ci_covers_the_suite.py checks).
      # Excluded: test_notebook_integration/ starts real kernels and is too slow
      # per push (the integration-core job runs its core set);
      # test_wheel_gate/ builds a wheel and drives a real Jupyter server for
      # minutes; nightly.yml runs it.
      # docs/ has its own job.
      # `perf` tests assert wall-clock thresholds and run in benchmarks.yml.
      # -n auto replaces pyproject's -n 16, which oversubscribes 3-4 vCPU runners.
      # -rs lists every skip with its reason, so a test that skips because a
      # package is missing from the dev extra shows up in the log.
      # The shard plugin keeps the tests whose node-id hash falls in this shard,
      # so the shards of one OS and Python run every test exactly once.
      # A step that stalls past pytest-timeout (a deadlocked worker, a frozen
      # runner) would otherwise hang for GitHub's 6 h default and leave no log:
      # faulthandler_timeout dumps every thread's stack into the log after
      # 120 s on one test, and timeout-minutes ends the step (the slowest,
      # macOS, takes about 15 min).
      - name: Run unit tests
        timeout-minutes: 20
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_notebook_integration \
            --ignore=tests/test_wheel_gate \
            --ignore=tests/docs \
            -m "not perf" \
            -p tools.test_selection.shard --shard=${{ matrix.shard }} \
            -n auto --tb=short -q -rs \
            -o faulthandler_timeout=120
        # Windows defaults to pwsh, where `\` does not continue a line.
        shell: bash

  # The dev extra resolves to polars 2, and polars 1 differs in what it
  # pickles, exports to Arrow and panics on (an Object column). The tests
  # named for polars run once more on the newest polars 1.
  polars-1:
    name: Polars tests on polars 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "polars>=1.0,<2"

      - name: Run the polars tests
        run: |
          pytest tests/ \
            --ignore=tests/test_notebook_integration \
            --ignore=tests/test_wheel_gate \
            --ignore=tests/docs \
            -m "not perf" -k "polars or lazy_frame" \
            -n auto --tb=short -q -rs
        shell: bash

  # The Linux, Windows and macOS runs above get pandas 3 on every Python but
  # 3.10, which pandas 3 does not support. Under pandas 2 frames share more
  # with what is built from them (no copy-on-write; a fitted model's
  # ``feature_names_in_`` is the frame's own column array), so the tests
  # named for pandas, frames, series, columns, scikit-learn and fits run
  # once more on a newer Python with pandas 2: about a tenth of the suite.
  pandas-2:
    name: Pandas tests on pandas 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "pandas>=2.2,<3"

      - name: Run the pandas tests
        run: |
          pytest tests/ \
            --ignore=tests/test_notebook_integration \
            --ignore=tests/test_wheel_gate \
            --ignore=tests/docs \
            -m "not perf" -k "pandas or frame or sklearn or fit or series or column" \
            -n auto --tb=short -q -rs
        shell: bash

  # The integration core set: the tests picked (tools/test_selection/) to cover
  # every line, feature and step sequence the whole integration suite covers,
  # in about a tenth of its time. The whole suite runs nightly (nightly.yml).
  # About 340 tests: 1.5 min on 4 workers locally, so roughly 5 min on a 4-vCPU
  # runner. Cheap enough for every Python version, where cash's source and
  # bytecode hashing can differ (working branches run the oldest, newest and
  # 3.13); Linux only, as kernels start slowest and least reliably on the
  # Windows and macOS runners.
  integration-core:
    name: Integration core set (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: plan
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.plan.outputs.core) }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the integration core set
        run: python -m pytest @tools/test_selection/core_set.txt -n auto --tb=short -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Same ruff version as .pre-commit-config.yaml, so a new ruff release
      # cannot fail CI with rules the code was never checked against.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.8

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  # Blocking. Runs everything in tests/docs/: doc examples execute, documented
  # claims resolve to real source, config and env-var tables match the code.
  docs-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # docs-test holds packages the doc examples import; tests/docs stubs them
      # by patching the real module, so they must be installed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs-test]"

      # -rs prints skip reasons; test_no_fingerprint_drift reports the drift
      # queue through its skip reason.
      - name: Run docs feature-parity tests
        run: pytest tests/docs/ -n auto -v -rs --tb=short

      # The test counts in the docs need `pytest --collect-only`, which cannot run
      # inside pytest. On failure run `python scripts/doc_numbers.py --update`.
      - name: Check derived doc numbers
        run: python scripts/doc_numbers.py --check

      # Advisory. The release gate in publish.yml (CASH_CLAIMS_STRICT=1) blocks.
      - name: Report drifted doc claims
        if: always()
        run: |
          # Fence the output so the step summary's Markdown keeps it verbatim.
          output="$(python scripts/claims.py --queue || true)"
          {
            echo '```'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Blocking. Runs the example notebooks top to bottom in real kernels, offline,
  # and the script example twice (the second run reads the first run's cache).
  # The allow-list and the reasons for what is left out are in the test file.
  example-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the example notebooks
        env:
          CASH_RUN_EXAMPLE_NOTEBOOKS: "1"
        run: pytest tests/docs/test_example_notebooks.py -n auto --tb=short -q

      - name: Run the script example twice
        run: |
          python examples/script_caching_demo.py
          python examples/script_caching_demo.py
