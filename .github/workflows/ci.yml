name: CI

# SCRATCH BRANCH ONLY (never merged): reproduce the Windows xdist worker crash in
# test_a_thread_left_running_by_a_cell_is_named.py::test_it_is_named_once_per_cell
# (CI 856, windows 3.14 shard 1/2). --capture=sys keeps fd 2 on the console so a
# faulthandler or pytest-timeout dump from a dying worker reaches this log.

on:
  push:
    branches: ["claude/scratch-win-thread"]

jobs:
  shard:
    name: shard 1/2 (${{ matrix.python-version }}, rep ${{ matrix.rep }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.10"]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run shard 1/2 as CI does, with dumps visible
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_notebook_integration \
            --ignore=tests/test_wheel_gate \
            --ignore=tests/docs \
            -m "not perf" \
            -p tools.test_selection.shard --shard=1/2 \
            -n auto --tb=short -q -rs --capture=sys -o faulthandler_timeout=25 --reruns 0
        shell: bash
      - name: Loop the thread tests under load
        if: always()
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          for i in $(seq 1 15); do
            python -m pytest tests/test_notebook/session tests/test_core/reads/test_work_a_call_leaves_running_is_not_stored.py \
              -n auto -q --capture=sys -o faulthandler_timeout=25 --reruns 0 -p no:cacheprovider 2>&1 | tail -25 || true
          done
        shell: bash
