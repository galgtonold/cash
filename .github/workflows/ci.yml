name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run unit tests
        run: |
          pytest tests/test_notebook/ tests/test_benchmarks.py tests/test_bench_eval.py tests/test_memory_eviction.py tests/test_statement_lineage.py tests/test_output_order.py tests/test_vscode_duplicates.py tests/test_config.py tests/test_backend_enhancements.py --tb=short -q

      # Curated subset of the notebook integration suite — the headline-feature
      # tests (basic flow, restore-after-restart, file invalidation, decorator
      # bridge, badge rendering, forward-probe skip, file-dep path fallback).
      # The full suite (~3.4k kernel-spinning tests) is too slow for per-push
      # CI; run it locally with `pytest tests/test_notebook_integration/`.
      - name: Run notebook integration smoke subset
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          pytest \
            tests/test_notebook_integration/test_basic_flow.py \
            tests/test_notebook_integration/test_disk_restore_after_restart.py \
            tests/test_notebook_integration/test_file_invalidation_real.py \
            tests/test_notebook_integration/test_decorator_bridge_integration.py \
            tests/test_notebook_integration/test_badge_integration.py \
            tests/test_notebook_integration/test_forward_probe_upstream_skip.py \
            tests/test_notebook_integration/test_file_dep_path_fallback.py \
            --tb=short -q
        timeout-minutes: 10

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      
      - name: Run ruff check
        run: ruff check src/cash/ --select E,F,W --ignore E501,E402
      
      - name: Run ruff format check
        run: ruff format --check src/cash/ || true
