name: CI

on:
  push:
    # The working branch everything is merged into (claude/batch and a number), so a change is green
    # on every platform before main moves to it. Other working branches are
    # tested locally before they are merged and run here by hand
    # (workflow_dispatch) when needed: each push to one used to start a full
    # run of its own, and runs of several branches queued behind each other
    # for the free plan's 20 concurrent jobs (a 45 min run took up to 94).
    branches: [main, master, "claude/batch[0-9]*"]
  pull_request:
    branches: [main, master]
  # Run by hand on any branch, e.g. one that is not ready for main.
  workflow_dispatch:

# A newer push to the same working branch supersedes a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# What the workflow's token may do unless a job asks for more: read the
# repository, nothing else.
permissions:
  contents: read

jobs:
  # Picks the tier. Working-branch pushes get a smaller matrix that fits GitHub's
  # free tier (20 concurrent jobs, 5 on macOS) without queueing; main, pull
  # requests into main and runs by hand get every OS x every supported Python.
  plan:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
      core: ${{ steps.plan.outputs.core }}
    steps:
      - id: plan
        env:
          FULL_TIER: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        run: |
          if [ "$FULL_TIER" = true ]; then
            # Keep the Python versions in step with the classifiers in pyproject.toml.
            unit='{
              "os": ["ubuntu-latest", "windows-latest", "macos-latest"],
              "python-version": ["3.12", "3.13", "3.14"],
              "shard": ["1/1"]
            }'
            core='["3.12", "3.13", "3.14"]'
          else
            # Pushes to the working branch: the oldest Python on macOS, the
            # newest on Windows and macOS, one on Linux, each in shards short
            # enough that the run takes about 25 min. Windows on the oldest
            # Python runs only in the full tier (when main moves, on pull
            # requests, and by hand before main moves) and nightly
            # (nightly.yml). The shards: Linux 3.13 took 22-29 min in three,
            # Windows 3.14 38-43 in two, macOS 28-30 in two. With the
            # integration core set on the oldest and newest Python, the run
            # is 20 jobs, 5 on macOS: the free plan's limits, so nothing
            # queues.
            unit='{"include": [
              {"os": "ubuntu-latest", "python-version": "3.13", "shard": "1/3"},
              {"os": "ubuntu-latest", "python-version": "3.13", "shard": "2/3"},
              {"os": "ubuntu-latest", "python-version": "3.13", "shard": "3/3"},
              {"os": "windows-latest", "python-version": "3.14", "shard": "1/4"},
              {"os": "windows-latest", "python-version": "3.14", "shard": "2/4"},
              {"os": "windows-latest", "python-version": "3.14", "shard": "3/4"},
              {"os": "windows-latest", "python-version": "3.14", "shard": "4/4"},
              {"os": "macos-latest", "python-version": "3.12", "shard": "1/2"},
              {"os": "macos-latest", "python-version": "3.12", "shard": "2/2"},
              {"os": "macos-latest", "python-version": "3.14", "shard": "1/3"},
              {"os": "macos-latest", "python-version": "3.14", "shard": "2/3"},
              {"os": "macos-latest", "python-version": "3.14", "shard": "3/3"}
            ]}'
            # The oldest and newest Python; Linux 3.13 runs the unit tests.
            core='["3.12", "3.14"]'
          fi
          echo "unit=$(jq -c . <<< "$unit")" >> "$GITHUB_OUTPUT"
          echo "core=$(jq -c . <<< "$core")" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    # Shard 1/1 is the whole suite; only split runs name their shard.
    name: test (${{ matrix.os }}, ${{ matrix.python-version }}${{ matrix.shard != '1/1' && format(', shard {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unit) }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          # Downloads kept between runs: installing took 1.5-3.5 min a job.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Run tests/ by exclusion, never by listing files, so a new test file runs
      # without anyone adding it here (tests/test_tooling/test_ci_covers_the_suite.py checks).
      # Excluded: test_notebook_integration/ starts real kernels and is too slow
      # per push (the integration-core job runs its core set);
      # test_wheel_gate/ builds a wheel and drives a real Jupyter server for
      # minutes; nightly.yml runs it.
      # docs/ has its own job.
      # `perf` tests assert wall-clock thresholds and run in benchmarks.yml.
      # -n auto replaces pyproject's -n 16, which oversubscribes 3-4 vCPU runners.
      # -rs lists every skip with its reason, so a test that skips because a
      # package is missing from the dev extra shows up in the log.
      # The shard plugin keeps the tests whose node-id hash falls in this shard,
      # so the shards of one OS and Python run every test exactly once.
      # A step that stalls past pytest-timeout (a deadlocked worker, a frozen
      # runner) would otherwise hang for GitHub's 6 h default and leave no log:
      # faulthandler_timeout dumps every thread's stack into the log after
      # 120 s on one test, and timeout-minutes ends the step (the slowest,
      # a whole macOS run, took up to 19.5 min, so every OS now runs in shards).
      # A Windows 3.14 shard reached 20 min of tests on 2026-10-29 and 28-30 min
      # by 2026-11-05 (every test uniformly slower than on macOS), so the
      # limit is 55.
      # --durations lists the slowest tests, so a shard creeping up on the
      # limit shows which tests took the time.
      # Tests marked nightly (a wheel build, real kernels) are deselected here
      # and run by nightly.yml's held-unit job, as are the full seed sweeps.
      - name: Run unit tests
        timeout-minutes: 55
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_notebook_integration \
            --ignore=tests/test_wheel_gate \
            --ignore=tests/docs \
            -m "not perf and not nightly" \
            -p tools.test_selection.shard --shard=${{ matrix.shard }} \
            -n auto --tb=short -q -rs --durations=40 \
            -o faulthandler_timeout=120
        # Windows defaults to pwsh, where `\` does not continue a line.
        shell: bash

  # The dev extra resolves to polars 2, and polars 1 differs in what it
  # pickles, exports to Arrow and panics on (an Object column). The tests
  # named for polars run once more on the newest polars 1.
  polars-1:
    name: Polars tests on polars 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "polars>=1.0,<2"

      - name: Run the polars tests
        run: |
          pytest tests/ \
            --ignore=tests/test_notebook_integration \
            --ignore=tests/test_wheel_gate \
            --ignore=tests/docs \
            -m "not perf" -k "polars or lazy_frame" \
            -n auto --tb=short -q -rs
        shell: bash

  # The Linux, Windows and macOS runs above get pandas 3. Under pandas 2
  # frames share more with what is built from them (no copy-on-write; a
  # fitted model's ``feature_names_in_`` is the frame's own column array),
  # so the tests named for pandas, frames, series, columns, scikit-learn and
  # fits run once more with pandas 2: about a tenth of the suite.
  pandas-2:
    name: Pandas tests on pandas 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "pandas>=2.2,<3"

      - name: Run the pandas tests
        run: |
          pytest tests/ \
            --ignore=tests/test_notebook_integration \
            --ignore=tests/test_wheel_gate \
            --ignore=tests/docs \
            -m "not perf" -k "pandas or frame or sklearn or fit or series or column" \
            -n auto --tb=short -q -rs
        shell: bash

  # The integration core set: the tests picked (tools/test_selection/) to cover
  # every line, feature and step sequence the whole integration suite covers,
  # in about a tenth of its time. The whole suite runs nightly (nightly.yml).
  # About 340 tests: 1.5 min on 4 workers locally, so roughly 5 min on a 4-vCPU
  # runner. Cheap enough for every Python version, where cash's source and
  # bytecode hashing can differ (the working branch runs the oldest and
  # newest); Linux only, as kernels start slowest and least reliably on the
  # Windows and macOS runners.
  integration-core:
    name: Integration core set (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: plan
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.plan.outputs.core) }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          # Downloads kept between runs: installing took 1.5-3.5 min a job.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the integration core set
        run: python -m pytest @tools/test_selection/core_set.txt -n auto --tb=short -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # Same ruff version as .pre-commit-config.yaml, so a new ruff release
      # cannot fail CI with rules the code was never checked against.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.8

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  # Blocking. Runs everything in tests/docs/: doc examples execute, documented
  # claims resolve to real source, config and env-var tables match the code.
  docs-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # docs-test holds packages the doc examples import; tests/docs stubs them
      # by patching the real module, so they must be installed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs-test]"

      # -rs prints skip reasons; test_no_fingerprint_drift reports the drift
      # queue through its skip reason.
      - name: Run docs feature-parity tests
        run: pytest tests/docs/ -n auto -v -rs --tb=short

      # cash ships py.typed. mypy and pyright check a sample of the documented
      # decorator use; neither is in the dev extra (pyright downloads Node), so
      # the test skips elsewhere and must not skip here. About 1 min.
      - name: Type-check the documented decorator use
        env:
          CASH_TEST_REQUIRE_TYPE_CHECKERS: "1"
        run: |
          pip install mypy pyright
          pytest tests/test_core/project/test_type_checkers_read_the_decorator.py -n 0 -q --tb=short

      # The test counts in the docs need `pytest --collect-only`, which cannot run
      # inside pytest. On failure run `python scripts/doc_numbers.py --update`.
      - name: Check derived doc numbers
        run: python scripts/doc_numbers.py --check

      # Advisory. The release gate in publish.yml (CASH_CLAIMS_STRICT=1) blocks.
      - name: Report drifted doc claims
        if: always()
        run: |
          # Fence the output so the step summary's Markdown keeps it verbatim.
          output="$(python scripts/claims.py --queue || true)"
          {
            echo '```'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Blocking. Runs the example notebooks top to bottom in real kernels, offline,
  # and the script example twice (the second run reads the first run's cache).
  # The allow-list and the reasons for what is left out are in the test file.
  example-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the example notebooks
        env:
          CASH_RUN_EXAMPLE_NOTEBOOKS: "1"
        run: pytest tests/docs/test_example_notebooks.py -n auto --tb=short -q

      - name: Run the script example twice
        run: |
          python examples/script_caching_demo.py
          python examples/script_caching_demo.py
