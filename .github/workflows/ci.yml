name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Keep in step with the Python classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Run tests/ by exclusion, never by listing files, so a new test file runs
      # without anyone adding it here (tests/test_ci_covers_the_suite.py checks).
      # Excluded: test_notebook_integration/ starts real kernels and is too slow
      # per push (the smoke subset below covers the headline features);
      # test_wheel_gate/ belongs to the release gate; docs/ has its own job.
      # `perf` tests assert wall-clock thresholds and run in benchmarks.yml.
      # -n auto replaces pyproject's -n 16, which oversubscribes 3-4 vCPU runners.
      - name: Run unit tests
        run: |
          pytest tests/ \
            --ignore=tests/test_notebook_integration \
            --ignore=tests/test_wheel_gate \
            --ignore=tests/docs \
            -m "not perf" \
            -n auto --tb=short -q
        # Windows defaults to pwsh, where `\` does not continue a line.
        shell: bash

      # Headline features of the notebook integration suite. Run the full suite
      # locally; see .github/copilot-instructions.md for choosing a subset.
      - name: Run notebook integration smoke subset
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          pytest \
            tests/test_notebook_integration/test_basic_flow.py \
            tests/test_notebook_integration/test_disk_restore_after_restart.py \
            tests/test_notebook_integration/test_file_invalidation_real.py \
            tests/test_notebook_integration/test_decorator_bridge_integration.py \
            tests/test_notebook_integration/test_badge_integration.py \
            tests/test_notebook_integration/test_forward_probe_upstream_skip.py \
            tests/test_notebook_integration/test_file_dep_path_fallback.py \
            -n auto --tb=short -q
        shell: bash
        timeout-minutes: 10

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Same ruff version as .pre-commit-config.yaml, so a new ruff release
      # cannot fail CI with rules the code was never checked against.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.8

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  # Blocking. Runs everything in tests/docs/: doc examples execute, documented
  # claims resolve to real source, config and env-var tables match the code.
  docs-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # docs-test holds packages the doc examples import; tests/docs stubs them
      # by patching the real module, so they must be installed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs-test]"

      # -rs prints skip reasons; test_no_fingerprint_drift reports the drift
      # queue through its skip reason.
      - name: Run docs feature-parity tests
        run: pytest tests/docs/ -n auto -v -rs --tb=short

      # The test counts in the docs need `pytest --collect-only`, which cannot run
      # inside pytest. On failure run `python scripts/doc_numbers.py --update`.
      - name: Check derived doc numbers
        run: python scripts/doc_numbers.py --check

      # Advisory. The release gate in publish.yml (CASH_CLAIMS_STRICT=1) blocks.
      - name: Report drifted doc claims
        if: always()
        run: |
          # Fence the output so the step summary's Markdown keeps it verbatim.
          output="$(python scripts/claims.py --queue || true)"
          {
            echo '```'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
