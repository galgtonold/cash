name: Benchmarks

# Not a merge gate: runs when benchmarks/ changes, weekly, or by hand from the
# Actions tab.
on:
  push:
    branches: [main, master]
    paths:
      - "benchmarks/**"
  pull_request:
    paths:
      - "benchmarks/**"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  tooling:
    name: Benchmark tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Run from the repo root: some tests start the benchmark scripts by relative path.
      - name: Run benchmark tooling tests
        run: python -m pytest benchmarks/tests -n auto --tb=short -q

  # Tests marked `perf` assert wall-clock thresholds. They are too noisy for the
  # unit job on shared runners, so they run here, serially, and never block.
  perf:
    name: Wall-clock threshold tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run perf tests
        run: >-
          python -m pytest tests/ -m perf -n 0 --tb=short -q
          --ignore=tests/test_notebook_integration
          --ignore=tests/test_wheel_gate
          --ignore=tests/docs
