name: Docs

# src/ is in the paths because mkdocstrings renders its docstrings into the site.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs_hooks.py"
      - ".readthedocs.yaml"
      - "src/**"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs_hooks.py"
      - ".readthedocs.yaml"
      - "src/**"

jobs:
  # Validate the docs build locally on every PR so broken docs don't reach main
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      # --strict turns every mkdocs warning (a broken link, a docstring
      # mkdocstrings cannot render) into a failure.
      - name: Build docs
        run: python -m mkdocs build --strict

# No deploy job: Read the Docs builds the site through its own GitHub
# integration. A webhook job that needs unset secrets would pass without firing.
