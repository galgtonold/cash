name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - "src/**/*.py"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"

jobs:
  # Validate the docs build locally on every PR so broken docs don't reach main
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      - name: Build docs
        run: python -m mkdocs build

  # On merge to main, trigger ReadTheDocs to rebuild (webhook)
  # Requires RTD_WEBHOOK_URL and RTD_WEBHOOK_TOKEN secrets configured in the
  # repo.  When either is unset the job is silently skipped, so the workflow
  # stays green until ReadTheDocs is wired up.
  trigger-rtd:
    name: Trigger ReadTheDocs build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check if RTD webhook is configured
        id: rtd_configured
        env:
          RTD_WEBHOOK_URL: ${{ secrets.RTD_WEBHOOK_URL }}
          RTD_WEBHOOK_TOKEN: ${{ secrets.RTD_WEBHOOK_TOKEN }}
        run: |
          if [ -n "$RTD_WEBHOOK_URL" ] && [ -n "$RTD_WEBHOOK_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RTD_WEBHOOK_URL/RTD_WEBHOOK_TOKEN not set; skipping ReadTheDocs trigger."
          fi

      - name: Trigger ReadTheDocs webhook
        if: steps.rtd_configured.outputs.configured == 'true'
        env:
          RTD_WEBHOOK_URL: ${{ secrets.RTD_WEBHOOK_URL }}
          RTD_WEBHOOK_TOKEN: ${{ secrets.RTD_WEBHOOK_TOKEN }}
        run: |
          curl -X POST \
            -d "token=$RTD_WEBHOOK_TOKEN" \
            "$RTD_WEBHOOK_URL"
