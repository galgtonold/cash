name: Integration tests (nightly)

# Runs the full notebook integration suite on a nightly schedule and on
# manual dispatch.  Excluded from per-push CI because the suite spins up
# ~3.4k real Jupyter kernels and does not fit in a 15-minute budget.

on:
  schedule:
    # 03:00 UTC every day — pick a quiet hour for hosted runners.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration:
    name: Notebook integration (ubuntu, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests in parallel
        run: |
          pytest tests/test_notebook_integration/ --tb=short -q -n auto --dist=loadfile
