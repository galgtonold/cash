services:
  notebook:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./examples:/app/examples
      - cash-cache:/app/.cash
    environment:
      - CASH_BACKEND=file
      - CASH_CACHE_DIR=/app/.cash

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  notebook-redis:
    build: .
    ports:
      - "8889:8888"
    volumes:
      - ./examples:/app/examples
    environment:
      - CASH_BACKEND=redis
      # cash reads the Redis address from separate fields, not from a URL.
      - CASH_REDIS_HOST=redis
      - CASH_REDIS_PORT=6379
    depends_on:
      - redis

volumes:
  cash-cache:
  redis-data:
